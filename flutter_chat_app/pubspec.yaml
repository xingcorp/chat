name: flutter_chat_app
description: A modern Flutter chat application with offline-first capability
publish_to: 'none'

version: 1.0.0+1

executables:
  setup: setup

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.2.0
  flutter_staggered_animations: ^1.1.1
  flutter_spinkit: ^5.2.0
  animations: ^2.0.8
  scrollable_positioned_list: ^0.3.8
  scroll_to_index: ^3.0.1
  visibility_detector: ^0.4.0+2

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.5
  rxdart: ^0.28.0
  dartz: ^0.10.1

  # UI & Animations
  flutter_animate: ^4.5.0

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.3.2

  # Networking
  dio: ^5.4.1
  dio_smart_retry: ^7.0.1
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^6.1.3
  graphql_flutter: ^5.1.2
  web_socket_channel: ^3.0.2
  http: ^1.2.0
  socket_io_client: ^3.1.1

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  firebase_performance: ^0.11.0
  
  # Background & Notifications
  flutter_local_notifications: ^19.0.0
  flutter_background_service: ^5.0.5
  flutter_background_service_android: ^6.2.2
  workmanager:
    git:
      url: https://github.com/fluttercommunity/flutter_workmanager.git
      path: workmanager
      ref: main

  # Storage
  shared_preferences: ^2.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  path: ^1.9.0
  flutter_cache_manager: ^3.3.1
  flutter_secure_storage: ^9.0.0
  quiver: ^3.2.2
  
  # Offline Database - Latest Dev Version as Required
  isar: ^4.0.0-dev.14
  isar_flutter_libs: ^4.0.0-dev.14

  # Media Processing
  image: ^4.1.7
  flutter_image_compress: ^2.1.0
  video_compress: ^3.1.2
  photo_view: ^0.15.0
  image_picker: ^1.0.7
  file_picker: ^8.1.6
  just_audio: ^0.10.4
  video_player: ^2.8.1
  chewie: ^1.7.4
  emoji_picker_flutter: ^3.1.0
  url_launcher: ^6.2.5
  any_link_preview: ^3.0.2
  pro_image_editor: ^11.3.0
  gal: ^2.3.2

  # Location Services
  geolocator: ^14.0.0
  geocoding: ^4.0.0

  # Encryption and Security
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Async utilities
  async: ^2.11.0

  # Utilities
  intl: ^0.20.2
  uuid: ^4.2.2
  mime: ^2.0.0
  device_info_plus: ^11.3.0
  flutter_native_splash: ^2.3.10
  logger: ^2.0.2+1
  go_router: ^16.0.0
  json_annotation: ^4.9.0
  
  # OAuth / SSO
  flutter_appauth: ^11.0.0

  # Environment
  flutter_dotenv: ^5.1.0
  flutter_keyboard_visibility: ^6.0.0
  flutter_screenutil: ^5.9.3
  timeago: ^3.7.0
  flutter_staggered_grid_view: ^0.7.0
  package_info_plus: ^8.3.0
  meta: ^1.15.0
  freezed_annotation: ^2.4.4
  permission_handler: ^12.0.1
  app_settings: ^6.1.1

  # Social
  share_plus: ^12.0.1
  flutter_html: ^3.0.0
  html: ^0.15.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  change_app_package_name: ^1.5.0

  # Integration Testing
  integration_test:
    sdk: flutter

  # Linting & Analysis
  flutter_lints: ^5.0.0
  custom_lint: ^0.7.0
  
  # Code Generation
  build_runner: ^2.4.8
  injectable_generator: ^2.4.1
  # isar_generator not needed for Isar v4.0.0-dev.14 - code generation is built-in
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  mockito: ^5.4.4
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  
  # Testing
  golden_toolkit: ^0.15.0

flutter:
  generate: true
  uses-material-design: true

  # Optimized assets for production builds
  assets:
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/animations/
    - .env.staging
    - .env.production

  # Production-optimized fonts (temporarily disabled)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700

# dart run build_runner build --delete-conflicting-outputs

# Production build commands:
# flutter build apk --release --tree-shake-icons --split-debug-info=build/debug-info --obfuscate
# flutter build ios --release --tree-shake-icons --split-debug-info=build/debug-info --obfuscate
