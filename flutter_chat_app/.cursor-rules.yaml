# .cursor-rules.yaml
# Rules for maintaining a clean, performant, and robust Flutter codebase

file_level_rules:
  # Encourage modularity by limiting file length. Adjust the number as needed for your team's standards.
  - rule_id: max_lines
    max_lines: 400 # Adjust as needed
    level: warning
    message: "File exceeds 400 lines. Consider refactoring into smaller, more focused components/classes."

rules:
  # Core layer rules (always apply)
  - name: clean_architecture
    path: .cursor/rules/core/clean_architecture.mdc
    
  - name: state_management
    path: .cursor/rules/core/state_management.mdc
    
  - name: error_handling
    path: .cursor/rules/core/error_handling.mdc
    
  - name: dependency_injection
    path: .cursor/rules/core/dependency_injection.mdc
    
  - name: testing_strategy
    path: .cursor/rules/core/testing_strategy.mdc
    
  - name: security_basics
    path: .cursor/rules/core/security_basics.mdc
    
  - name: internationalization_error_handling
    path: .cursor/rules/core/internationalization_error_handling.mdc
    
  # Feature layer rules (apply to specific domains)
  - name: realtime_messaging
    path: .cursor/rules/feature/realtime_messaging.mdc
    
  - name: offline_sync
    path: .cursor/rules/feature/offline_sync.mdc
    
  - name: worker_pool_scaling
    path: .cursor/rules/feature/worker_pool_scaling.mdc
    
  - name: media_handling
    path: .cursor/rules/feature/media_handling.mdc
    
  - name: animation_patterns
    path: .cursor/rules/feature/animation_patterns.mdc
    
  - name: isolate_management
    path: .cursor/rules/feature/isolate_management.mdc
    
  - name: notification_system
    path: .cursor/rules/feature/notification_system.mdc
    
  - name: ai_readiness
    path: .cursor/rules/feature/ai_readiness.mdc

  - name: internationalization
    path: .cursor/rules/feature/internationalization.mdc

  # Discourage leaving debug print statements in the codebase. Use a proper logger instead.
  - rule_id: no-print
    match: '\bprint\('
    level: warning
    message: "Avoid using print(). Use a dedicated logging package for better control and performance."
    glob: "lib/**/*.dart"

  # Avoid the null assertion operator (!) as it can lead to runtime crashes. Handle nulls safely.
  - rule_id: no-bang-operator
    # Matches an identifier, ], or ) followed by !
    match: '([a-zA-Z0-9_\]\)]+)\!'
    level: warning
    message: "Avoid using the null assertion operator (!). Prefer null-aware operators (?, ??) or explicit null checks for robustness."
    glob: "lib/**/*.dart"

  # Avoid the 'as' operator for type casting where possible, as it can cause runtime errors.
  - rule_id: no-as-operator
    match: '\bas\b'
    level: warning
    message: "Avoid using the 'as' operator for type casting. Prefer 'is' checks with smart casting or tryCast methods."
    glob: "lib/**/*.dart"

  # Encourage standardized TODO comments for better tracking.
  - rule_id: standardize-todos
    # Matches // TODO followed by anything except (username):
    match: '\/\/\s*TODO([^(].*)?$'
    level: info
    message: "Consider adding context to TODO comments, e.g., '// TODO(your_username): Explain the task briefly' or '// TODO(#issue_number): Description'."
    glob: "lib/**/*.dart"

  # Encourage using BLoC instead of setState in UI components.
  - rule_id: discourage-setstate-in-ui
    description: Encourage using BLoC instead of setState in UI components.
    match: 'setState\('
    level: warning
    message: "Prefer using BLoC widgets (BlocBuilder, BlocListener, etc.) for state management instead of calling setState() directly in UI components. Reserve setState for local, ephemeral UI state if necessary."
    glob: "lib/presentation/**/*.dart" # Target files within the presentation layer

  # --- Clean Architecture Enforcement Rules ---

  # Prevent direct usage of DataSources in the Presentation layer.
  - rule_id: no-direct-datasource-in-presentation
    description: Prevent direct usage of DataSources in the Presentation layer.
    match: 'import.*package:.*/data/datasources/.*'
    level: error
    message: "Presentation layer (UI, Blocs) must not import directly from DataSources (data/datasources). Use Domain UseCases or Repositories instead."
    glob: "lib/presentation/**/*.dart"

  # Prevent direct usage of Data Models (DTOs) in the Presentation layer.
  - rule_id: no-direct-model-in-presentation
    description: Prevent direct usage of Data Models (DTOs) in the Presentation layer.
    match: 'import.*package:.*/data/models/.*'
    level: error
    message: "Presentation layer (UI, Blocs) must not import directly from Data Models (data/models). Use Domain Entities instead."
    glob: "lib/presentation/**/*.dart"

  # Ensure Domain layer remains independent of UI and Infrastructure frameworks.
  - rule_id: no-framework-in-domain
    description: Ensure Domain layer remains independent of UI and Infrastructure frameworks.
    match: 'import.*package:(flutter|http|sqflite|shared_preferences)/.*' # Add other infra packages if needed
    level: error
    message: "Domain layer (domain/) must not import Flutter framework (package:flutter/...) or infrastructure packages (e.g., http, sqflite). Depend only on Dart core and domain interfaces."
    glob: "lib/domain/**/*.dart"

  # Prevent hardcoded strings in UI for internationalization
  - rule_id: no-hardcoded-strings
    description: Prevent hardcoded user-visible strings in the UI
    match: '(Text|TextSpan|AppBar|AlertDialog|ElevatedButton|TextButton|OutlinedButton)\s*\(\s*["''][^"''$]+["'']'
    level: warning
    message: "Avoid hardcoded strings in UI components. Use localized strings (context.l10n.keyName) for better internationalization support."
    glob: "lib/presentation/**/*.dart"

  # Ensure proper RTL support for internationalization
  - rule_id: ensure-rtl-support
    description: Ensure proper RTL (Right-to-Left) support in UI layouts
    match: '(Padding|EdgeInsets)\.(only|symmetric)\(\s*left:'
    level: info
    message: "Consider using start/end instead of left/right for proper RTL language support. Use EdgeInsets.only(start: X) instead of EdgeInsets.only(left: X)."
    glob: "lib/presentation/**/*.dart"

  # --- General Code Style & Quality Rules ---

  # Prefer 'final' for local variables that are not reassigned.
  - rule_id: prefer-final-locals
    description: Prefer 'final' for local variables that are not reassigned.
    match: '^\s*var\s+\w+\s*=' # Matches local 'var' with initializer
    level: info
    message: "Consider using 'final' instead of 'var' for local variables if they are not reassigned."
    glob: "lib/**/*.dart"

  # Encourage documentation comments for public top-level APIs.
  - rule_id: require-doc-comments
    description: Encourage documentation comments (///) for public top-level APIs.
    # Matches top-level class/enum/mixin/extension/typedef/function declarations not preceded by ///
    # Note: This regex is approximate and might have limitations.
    match: '^(?!///\\s)(?:class |enum |mixin |extension |typedef |\\w+[<\\w,\\s>]*\\s+\\w+\\s*\\()'
    level: info
    message: "Consider adding documentation comments (///) for public top-level declarations (classes, functions, enums, etc.)."
    glob: "lib/**/*.dart"

  # Avoid catching broad exception types like Object or Exception.
  - rule_id: no-broad-exception-catch
    description: Avoid catching broad exception types like Object or Exception.
    # Matches `catch(e)` or `catch(e,s)` without specific type, or catching Object/Exception directly.
    match: '\\bcatch\\s*\\(\\s*(?:final\\s+)?(e|err|error|exception|_)(?:,\\s*(?:final\\s+)?(s|st|stack|_))?\\s*\\)|\\bcatch\\s*\\(\\s*(?:final\\s+)?(Object|Exception)\\b'
    level: warning
    message: "Avoid catching generic 'Exception' or 'Object'. Catch specific exceptions whenever possible for better error handling."
    glob: "lib/**/*.dart"


