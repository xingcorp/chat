plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    // Firebase Google Services plugin for multi-flavor support
    id "com.google.gms.google-services"
    id 'com.google.firebase.firebase-perf'
    id 'com.google.firebase.crashlytics'
}

android {
    namespace = "com.oxii.chat"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    // Enable BuildConfig generation (required for AGP 8.x+)
    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Enable core library desugaring
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        // Base application configuration
        applicationId = "com.oxii.chat"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

        // Enterprise messaging app configuration
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true

        // Default build config fields
        buildConfigField "String", "FLAVOR", '"production"'
        buildConfigField "String", "API_BASE_URL", '"https://oxii-office-api.oxiitek.com"'
        buildConfigField "String", "WEBSOCKET_URL", '"wss://oxii-office-api.oxiitek.com"'
        buildConfigField "boolean", "ENABLE_LOGGING", "false"
    }

    // **ENTERPRISE FLAVOR CONFIGURATION**
    flavorDimensions "environment"

    productFlavors {
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"

            // Staging-specific configuration
            buildConfigField "String", "FLAVOR", '"staging"'
            buildConfigField "String", "API_BASE_URL", '"https://api-staging.oxii.chat"'
            buildConfigField "String", "WEBSOCKET_URL", '"wss://ws-staging.oxii.chat"'
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
            buildConfigField "boolean", "ENABLE_MOCK_DATA", "true"
            buildConfigField "boolean", "ENABLE_DEBUG_TOOLS", "true"

            // Staging app name
            resValue "string", "app_name", "OXII Chat STG"

            // Staging notification channel
            resValue "string", "notification_channel_id", "oxii_chat_staging_notifications"

            // Staging Firebase configuration
            resValue "string", "firebase_project_id", "oxii-chat-staging"
        }

        production {
            dimension "environment"

            // Production configuration
            buildConfigField "String", "FLAVOR", '"production"'
            buildConfigField "String", "API_BASE_URL", '"https://oxii-office-api.oxiitek.com"'
            buildConfigField "String", "WEBSOCKET_URL", '"wss://oxii-office-api.oxiitek.com"'
            buildConfigField "boolean", "ENABLE_LOGGING", "false"
            buildConfigField "boolean", "ENABLE_MOCK_DATA", "false"
            buildConfigField "boolean", "ENABLE_DEBUG_TOOLS", "false"

            // Production app name
            resValue "string", "app_name", "OXII Chat"

            // Production notification channel
            resValue "string", "notification_channel_id", "oxii_chat_notifications"

            // Production Firebase configuration
            resValue "string", "firebase_project_id", "oxii-chat-prod"
        }
    }

    buildTypes {
        release {
            // Production build optimizations for enterprise messaging app
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug

            // Performance optimizations
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }

        profile {
            // Profile build for performance testing with production-like optimizations
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug

            // Performance optimizations for profiling
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

flutter {
    source = "../.."
}
